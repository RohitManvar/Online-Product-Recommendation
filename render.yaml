services:
  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  - type: web
    name: product-recommendation-api
    env: python
    plan: free
    region: oregon
    rootDir: backend
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        sync: false   # Set after frontend deploys, e.g. https://product-recommendation-frontend.onrender.com

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  - type: web
    name: product-recommendation-frontend
    env: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: BACKEND_URL
        sync: false   # Set to https://product-recommendation-api.onrender.com
      - key: NODE_ENV
        value: production
